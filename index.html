<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Academy - Connexion</title>
    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
<style>

body{
    margin:0;
    background:#101820;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.login{
    width:420px;
    background:#1c2735;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

h1{
    margin-bottom:10px;
}

input{
    width:90%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#8b0000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#b30000;
}

</style>

</head>

<body>

<div class="login">

<h1>BLACKWOOD ACADEMY</h1>

<p>Ordinateur personnel d'Elyana Hawthorne</p>

<div style="position:relative;width:90%;margin:auto;">
<input type="password" id="password" placeholder="Mot de passe" style="width:100%;padding-right:45px;box-sizing:border-box;">

<i class="fa-regular fa-eye"
onclick="voirMdp()"
style="position:absolute;right:15px;top:50%;transform:translateY(-50%);
cursor:pointer;font-size:18px;color:#888;">
</i>

</div>
    
<button onclick="verifierMotDePasse()">Déverrouiller</button>

<p id="message" style="color:#ff6b6b;margin-top:15px;"></p>

</div>
<script>
function voirMdp(){

let champ=document.getElementById("password");

if(champ.type=="password"){

champ.type="text";

}

else{

champ.type="password";

}

}
function verifierMotDePasse(){

let mdp=document.getElementById("password").value.toLowerCase().trim();

if(mdp=="la justice ne peut pas attendre"){

document.getElementById("message").style.color="#7CFC00";
document.getElementById("message").innerHTML="Connexion en cours...";

setTimeout(function(){

window.location.href="ordinateur.html";

},1200);

}

else{

document.getElementById("message").style.color="#ff6b6b";
document.getElementById("message").innerHTML="Mot de passe incorrect.";

}

}

</script>
</body>
</html>
