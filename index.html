<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Academy - Connexion</title>

<style>

body{
    margin:0;
    background:#101820;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.login{
    width:420px;
    background:#1c2735;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

h1{
    margin-bottom:10px;
}

input{
    width:90%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#8b0000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#b30000;
}

</style>

</head>

<body>

<div class="login">

<h1>BLACKWOOD ACADEMY</h1>

<p>Ordinateur personnel d'Elyana Hawthorne</p>

<input type="password" placeholder="Mot de passe">

<button>Déverrouiller</button>

</div>

</body>
</html>
