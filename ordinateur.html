<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood OS</title>

<style>

.desktop{
height:calc(100vh - 50px);
padding:30px;
background:linear-gradient(180deg,#1f2c3a,#101820);
}

.icone{
width:110px;
text-align:center;
color:white;
font-size:40px;
margin-bottom:30px;
cursor:pointer;
}

.icone p{
font-size:15px;
margin-top:8px;
}

.barre{
position:fixed;
bottom:0;
left:0;
right:0;
height:50px;
background:#111;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
font-size:14px;
}
</style>

</head>


<body>

<div class="desktop">

    <div class="icone">
        📂
        <p>Mes recherches</p>
    </div>

    <div class="icone">
        📚
        <p>Cours</p>
    </div>

    <div class="icone">
        🌐
        <p>Navigateur</p>
    </div>

    <div class="icone">
        🗑️
        <p>Corbeille</p>
    </div>

</div>

<div class="barre">
    <div>🛡️ Blackwood OS</div>
    <div>08/09/2026&nbsp;&nbsp;15:25</div>
</div>

</body>
</html>
